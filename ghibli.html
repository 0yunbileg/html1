<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibli</title>
    <link rel="stylesheet" href="ghibli.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

</head>

<body>
    <main>
        <header>
            <div class="headerLeft">
                <div class="logoWrapper">
                    <img class="logo" src="images/logo.jpg">
                </div>
                <nav class="menu">
                    <a>home</a>
                    <a>series</a>
                    <a>movie</a>
                    <a>game</a>
                    <a>Latest Content</a>
                    <a>My Wishlist</a>
                    <a>Browse by Language</a>
                </nav>
            </div>
            <div class="headerRight">
                <i class="material-icons">search</i>
                <span>Kids</span>
                <i class="material-icons">notifications</i>
                <i class="material-icons">account_circle</i>
            </div>
        </header>

        <div class="container">
        </div>
    </main>

    <script>
        const container = document.querySelector(".container");

        function getMovies() {
            fetch(`https://ghibliapi.vercel.app/films`)
                .then((res) => {
                    if (!res.ok) throw new Error("Movies not found, api wrong");
                    return res.json();
                })
                .then((data) => {
                    console.log(data);
                    const movies = data;
                    movies.map((movie) => {
                        const list = document.createElement("div");
                        list.classList.add("movieContainer");

                        list.innerHTML = `
                            <div class="imgDiv">
                                <img src="${movie.image}" alt="${movie.title}"/>
                                <div class="detailsDiv">
                                    <p class="titleD">${movie.title}</p>
                                    <p class="descriptionD">${movie.description}</p>

                                </div>
                            </div>
                            <h2 class="movieTitle">${movie.title}</h2>
                            `;

                        container.appendChild(list);
                    });
                });
        }

        getMovies();
    </script>
</body>

</html>
