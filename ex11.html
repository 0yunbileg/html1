<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = prompt("name: ");
        let age = prompt("age: ");
        let gender = prompt("gender: ");
        let role = prompt("role: ");
        let members = [];

        function addMember(name, age, gender, role) {
            let member = {
                name: name,
                age: age,
                gender: gender,
                role: role
            };
            members.push(member);
        };

        addMember(name, age, gender, role);

        console.log(members.pop());
    </script>
</body>
</html>
