<body>
    <script>
        console.log(Object(0n) === 0n); // false
        console.log(Object(0n) == 0n); // true
        console.log(Object(0n) === Object(0n)); // false

        const o = Object(0n);
        console.log(o === o); // true

        let num = 2n;
        console.log(Object(num) === Object(num)); //false
        console.log(Object(num) == Object(num)); //false
    </script>
