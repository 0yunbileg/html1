<body>
    <script>
        let a = Number(prompt());
        let b = Number(prompt());
        let c = Number(prompt());

        function highestNumber(a, b, c) {
            let highestNumber = c;
            if(a > b && a > c) {highestNumber = a;}
            else if(b > c){highestNumber = b;}

            return highestNumber;
        }

        console.log(highestNumber(a, b, c));
    </script>
