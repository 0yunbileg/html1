<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="inventory.css">
</head>

<body>
    <main>
        <div class="addItem">
            <label for="name">Name</label>
            <input type="text" name="name" placeholder="Enter name ...">

            <label for="price">Price</label>
            <input type="number" name="price" placeholder="Enter price ...">

            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" placeholder="Enter quantity ...">

            <button type="submit" id="addItemButton">Add Item</button>
        </div>
        <p id="totals"></p>
        <p id="printInventory"></p>
    </main>

    <script>
        class Item {
            constructor(name, price, quantity) {
                this.name = name;
                this.price = price;
                this.quantity = quantity;
            }

            getTotalPrice() {
                return this.price * this.quantity;
            }
        }

        class Inventory extends Item {
            constructor(name, price, quantity) {
                super(name, price, quantity);
                this.items = new Array();
            }

            addItem(item) {
                this.items.push(item);
            }

            removeItem(itemName) {
                this.items = this.items.filter(item => item.name !== itemName);
            }

            getInventoryValue() {
                let total = 0;
                this.items.map(item => total += item.getTotalPrice());
                return total;
            }

            printInventory() {
                let printValues = "";
                this.items.forEach(item => printValues += Object.entries(item).toString() + "<br>");
                return printValues;
            }
        }

        let addItemButton = document.getElementById("addItemButton");


        const item1 = new Item('Laptop', 1200, 2);
        const item2 = new Item('Mouse', 25, 10);
        const item3 = new Item('Keyboard', 75, 5);
        const item4 = new Item("name4", 4, 4);
        const item5 = new Item("name5", 5, 5);

        const inventory = new Inventory();
        inventory.addItem(item1);
        inventory.addItem(item2);
        inventory.addItem(item3);
        inventory.addItem(item4);
        inventory.addItem(item5);

        inventory.removeItem("name5");



        addItemButton.addEventListener('click', () => inventory.addItem(item1));

        console.log(addItemButton);

        document.getElementById("totals").innerHTML = `total: ${inventory.getInventoryValue()}`;
        document.getElementById("printInventory").innerHTML = inventory.printInventory();
    </script>
</body>

</html>
