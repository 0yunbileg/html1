<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="inventory.css">
</head>

<body>
    <main>
        <div class="addItem">
            <label for="name">Name</label>
            <input type="text" name="name" id="nameInput" placeholder="Enter name ...">

            <label for="price">Price</label>
            <input type="number" name="price" id="priceInput" placeholder="Enter price ...">

            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" id="quantityInput" placeholder="Enter quantity ...">

            <button type="submit" id="addItemButton" onclick="addItem()">Add Item</button>
        </div>

        <div class="output">
            <h3>Inventory:</h3>
            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Price ($)</th>
                        <th>Quantity</th>
                        <th>Total ($)</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <strong>Total Inventory Value: $<span id="totalValue"></span></strong>
        </div>
    </main>

    <script>
        class Item {
            constructor(name, price, quantity) {
                this.name = name;
                this.price = price;
                this.quantity = quantity;
            }

            getTotalPrice() {
                return this.price * this.quantity;
            }
        }

        class Inventory extends Item {
            constructor(name, price, quantity) {
                super(name, price, quantity);
                this.items = new Array();
            }

            addItem(item) {
                this.items.push(item);
            }

            removeItem(itemName) {
                this.items = this.items.filter(item => item.name !== itemName);
            }

            getInventoryValue() {
                let total = 0;
                this.items.map(item => total += item.getTotalPrice());
                return total;
            }

            printInventory() {
                let printValues = "";
                this.items.forEach(item => printValues += Object.entries(item).toString() + "<br>");
                return printValues;
            }

            getItems() {
                return this.items
            }
        }

        const item1 = new Item('Laptop', 1200, 2);
        const item2 = new Item('Mouse', 25, 10);
        const item3 = new Item('Keyboard', 75, 5);
        const item4 = new Item("name4", 4, 4);
        const item5 = new Item("name5", 5, 5);

        const inventory = new Inventory();
        inventory.addItem(item1);
        inventory.addItem(item2);
        inventory.addItem(item3);
        inventory.addItem(item4);
        inventory.addItem(item5);

        inventory.removeItem("name5");

        function updateDisplay() {
            const tableBody = document.querySelector('#inventoryTable tbody');
            tableBody.innerHTML = '';

            inventory.getItems().forEach((item, index) => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>${item.getTotalPrice()}</td>`;

                tableBody.appendChild(row);
            });

            document.getElementById('totalValue').textContent = inventory.getInventoryValue();
        }

        function addItem() {
            let name = document.getElementById("nameInput").value;
            let price = document.getElementById("priceInput").value;
            let quantity = document.getElementById("quantityInput").value;

            if (!name || isNaN(price) || isNaN(quantity)) {
                alert('Please fill in all fields correctly.');
                return;
            }

            const item = new Item(name, price, quantity);
            inventory.addItem(item);
            document.getElementById("nameInput").value = "";
            document.getElementById("priceInput").value = "";
            document.getElementById("quantityInput").value = "";
            updateDisplay();
        }
    </script>
</body>

</html>
