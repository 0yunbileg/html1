<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container"></div>
    <p id="point"></p>
</body>

<script>
    let point = 0;
    const square = 100;
    const boxes = new Array();
    let clickedIndex, dotIndex;

    const container = document.querySelector(".container");

    function createGrid() {
        for (let i = 0; i < square; i++) {
            const box = document.createElement("div");
            box.classList.add("box");
            box.onclick = () => {
                clickedIndex = i;
                if (clickedIndex === dotIndex) {
                    boxes[clickedIndex].classList.remove("dot");
                    randomDotGenerator();
                    point += 10;
                    console.log(point);
                } else {
                    point -= 10;
                }
                document.getElementById("point").innerHTML = point;
            };

            boxes.push(box);
            container.appendChild(box);
        }
    }

    function randomDotGenerator() {
        dotIndex = Math.floor(Math.random() * square);
        boxes[dotIndex].classList.add("dot");
    }

    createGrid();
    randomDotGenerator();

</script>

</html>
