<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //Ex 1
        const booksArray = ["book1", "book2", "book3", "book4", "book5"];
        console.log("ex1: ", booksArray[2]);

        //Ex2 
        const animals = ["Lion", "Tiger", "Elephant", "Giraffe"];
        animals[1] = "Panda";
        console.log("ex2: ", animals);

        //Ex3
        const books = ["1984", "Brave New World", "Fahrenheit 451"];
        books.push("math book");
        books.push("English book");
        console.log("ex3: ", books);

        //Ex4
        const numbers = [10, 20, 30, 40, 50];
        console.log("ex4: index of 30 is ", numbers.indexOf(30));

        //Ex5
        const fruits1 = ["fruit1", "fruit2", "fruit3"];
        const fruits2 = ["fruit4", "fruit5", "fruit6"];
        const allFruits = fruits1.concat(fruits2);
        console.log("ex5: ", allFruits);

        //Ex6
        const colors = ["Red", "Green", "Blue", "Yellow", "Purple"];
        console.log("ex6, Red: ", colors.includes("Red"));
        console.log("ex6, Green: ", colors.includes("Green"));
        console.log("ex6, Black: ", colors.includes("Black"));
        console.log("ex6, Purple: ", colors.includes("Purple"));
        console.log("ex6, Blue: ", colors.includes("Blue"));
        console.log("ex6, Yellow: ", colors.includes("Yellow"));

        //Ex7
        const array1 = ["a", "b", "c"];
        const array2 = ["a", "b", "c"];

        function haveEqualLength(array1, array2) {
            return array1.length == array2.length;
        }

        console.log("ex7, Arrays have equal length: ", haveEqualLength(array1, array2));

        //Ex8
        const words = ["JavaScript", "is", "a", "versatile", "language"];
        //console.log("ex8: ", words.toString());
        console.log("ex8: ", words.join(" "));

        //Ex9
        const students = [
            { name: "Anu", grade: 85 },
            { name: "Bold", grade: 92 },
            { name: "Tuvshin", grade: 78 },
            { name: "Naraa", grade: 88 },
            { name: "Solongo", grade: 95 }
        ];

        //9.1
        let topStudents = new Array();
        students.forEach(student => { if (student.grade > 90) { topStudents.push(student) } });
        console.log("d1, top students: ", topStudents);

        //9.2
        console.log("d1, sorted by grade: ", students.sort((x, y) => y.grade - x.grade));

        //9.3

        let highestGrade = 0;

        students.forEach(student => { if (student.grade > highestGrade) { highestGrade = student.grade } });
        let highestStudent = students.find(student => student.grade == highestGrade);
        console.log("d1, highest grade student: ", highestStudent);


        //Ex10
        const products = [
            { id: 1, name: "Laptop", price: 2500 },
            { id: 2, name: "Mouse", price: 25 },
            { id: 3, name: "Monitor", price: 400 },
            { id: 4, name: "Keyboard", price: 100 },
            { id: 5, name: "Phone", price: 1200 }
        ];

        //10.1
        const cheapProductNames = new Array();
        products.forEach(product => { if (product.price < 500) { cheapProductNames.push(product.name) } });
        console.log("d2, cheap product names: ", cheapProductNames);

        //10.2
        console.log("d2, sorted by price: ", products.sort((x, y) => x.price - y.price));

        //10.3
        function getHigherThan1000(value, index, array) { return value.price > 1000 };
        let higherThan1000 = products.find(getHigherThan1000);
        console.log("d2, first product higher than 1000: ", higherThan1000);

        //Ex11
        const students1 = [
            { id: 1, name: "Anu", grades: [90, 88, 95] },
            { id: 2, name: "Bold", grades: [75, 80, 85] },
            { id: 3, name: "Anu", grades: [92, 91, 94] },
            { id: 4, name: "Tuvshin", grades: [80, 78, 82] },
            { id: 5, name: "Solongo", grades: [95, 94, 93] },
            { id: 6, name: "Tuvshin", grades: [80, 60, 50] },
        ];

        //11.1
        function getAverageGrade(grades) {
            let averageGrade = 0;
            grades.forEach(grade => { averageGrade += grade; })
            return Math.floor(averageGrade / 3);
        }

        students1.forEach(student => { student.grades = getAverageGrade(student.grades); });

        students1.forEach(student => {
            const sameNameStudents = students1.filter(function (student1) {
                return student1.name === student.name;
            });
            if (sameNameStudents.length > 1) {
                let index1 = students1.indexOf(sameNameStudents[0]);
                let index2 = students1.indexOf(sameNameStudents[1]);

                if (sameNameStudents[0].grades > sameNameStudents[1].grades) { delete students1[index2] }
                else { delete students1[index1] };
            }
        });

        console.log("d3, after removing same names: ", students1);

        //11.2
        console.log("d3, sorted by grade: ", students1.sort((x, y) => y.grades - x.grades));

        //11.3
        function getLowerThan80(value, index, array) {
            return value.grades <= 80;
        };
        let lowerThan80 = students1.find(getLowerThan80);
        console.log("d3, first student lower than 80: ", lowerThan80);

        //Ex12
        const products1 = [
            { id: 101, name: "Laptop", prices: [2000, 2100, 1900] },
            { id: 102, name: "Mouse", prices: [25, 27, 24] },
            { id: 103, name: "Keyboard", prices: [100, 110, 90] },
            { id: 104, name: "Laptop", prices: [1950, 1980, 2000] },
            { id: 105, name: "Monitor", prices: [400, 390, 410] }
        ];

        //12.1
        function getAveragePrice(prices) {
            let averagePrice = 0;
            prices.forEach(price => { averagePrice += price; })
            return Math.floor(averagePrice / 3);
        }

        products1.forEach(product => { product.averagePrice = getAveragePrice(product.prices); });

        console.log("d4, added average prices: ", products1);

        //12.2
        products1.forEach(product => {
            const sameNameProducts = products1.filter(function (product1) {
                return product1.name === product.name;
            });
            if (sameNameProducts.length > 1) {
                let index1 = products1.indexOf(sameNameProducts[0]);
                let index2 = students1.indexOf(sameNameProducts[1]);

                if (sameNameProducts[0].averagePrice < sameNameProducts[1].averagePrice) { delete products1[index2] }
                else { delete products1[index1] };
            }
        });

        console.log("d4, removed same name products: ", products1);

        //12.3
        console.log("d4, sorted by average price: ", products1.sort((x, y) => x.averagePrice - y.averagePrice));

        //12.4
        function getHigherThan1000(value, index, array) { return value.averagePrice > 1000 };
        let higherThan10001 = products1.find(getHigherThan1000);
        console.log("d4, first product higher than 1000: ", higherThan10001);

        //12.5
        products1.forEach(product => {
            let name = product.name;
            let index = products1.indexOf(product);
            console.log(`d4, index of ${name} is ${index}.`);
        });

        //Ex13
        const moviesA = [
            { id: 1, title: "Inception", genre: "Sci-Fi", rating: 9 },
            { id: 2, title: "Titanic", genre: "Romance", rating: 8 },
            { id: 3, title: "The Matrix", genre: "Sci-Fi", rating: 9 }
        ];

        const moviesB = [
            { id: 4, title: "The Godfather", genre: "Crime", rating: 10 },
            { id: 5, title: "Titanic", genre: "Romance", rating: 8 },
            { id: 6, title: "Interstellar", genre: "Sci-Fi", rating: 9 }
        ];

        //13.1
        const allMovies = moviesA.concat(moviesB);
        console.log("d5, all movies: ", allMovies);

        //13.2
        moviesA.forEach(movieA => {
            moviesB.forEach(movieB => {
                if (movieA.title == movieB.title) {
                    delete moviesB[moviesB.indexOf(movieB)];
                };
            });
        });

        const uniqueMovies = moviesA.concat(moviesB);
        console.log("d5, unique movies: ", uniqueMovies);

        //13.3
        console.log("d5, sorted by rating: ", uniqueMovies.sort((x, y) => y.rating - x.rating));

        //13.4
        function getFirstSciFi(value, index, array) {
            return value.genre === "Sci-Fi";
        }
        let firstSciFi = uniqueMovies.find(getFirstSciFi);
        console.log("d5, first sci-fi: ", firstSciFi);

        //13.5
        let titles = new Array();
        uniqueMovies.forEach(movie => { titles.push(movie.title); });
        console.log("d5, movie titles: ", titles.join(", "));

        //13.6
        let genres = new Array();
        uniqueMovies.forEach(movie => { if (!genres.includes(movie.genre)) { genres.push(movie.genre) }; });
        console.log("d5, movie genres: ", genres);

        //Ex14
        const asia = [
            { id: 1, country: "Japan", cities: ["Tokyo", "Kyoto"] },
            { id: 2, country: "Mongolia", cities: ["Ulaanbaatar", "Erdenet"] }
        ];

        const europe = [
            { id: 3, country: "France", cities: ["Paris", "Nice"] },
            { id: 4, country: "Germany", cities: ["Berlin", "Munich"] },
            { id: 2, country: "Mongolia", cities: ["Ulaanbaatar", "Erdenet"] } // давхардсан
        ];

        //14.1
        const allDestinations = asia.concat(europe);
        console.log("d6, all destinations: ", allDestinations);

        //14.2
        asia.forEach(destinationA => {
            europe.forEach(destinationE => {
                if(destinationA.country == destinationE.country) {
                    delete europe[europe.indexOf(destinationE)]
                }
            })
        });

        const uniqueDestinations = asia.concat(europe);
        console.log("d6, unique destinations: ", uniqueDestinations);

        //14.3
        const allCities = new Array();
        uniqueDestinations.forEach(destination => {
            destination.cities.forEach(city => {allCities.push(city);});
        });
        console.log("d6, all cities: ", allCities);

    </script>
</body>

</html>
