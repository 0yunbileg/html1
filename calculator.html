        <div class="calculator">

            <div class="buttonsDiv">
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(1)">1</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(2)">2</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(3)">3</button>
                <button data-key="65" class="functionBtn" onclick="functionBtnClicked('add')">+</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(4)">4</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(5)">5</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(6)">6</button>
                <button data-key="65" class="functionBtn" onclick="functionBtnClicked('subtract')">-</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(7)">7</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(8)">8</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(9)">9</button>
                <button data-key="65" class="functionBtn" onclick="functionBtnClicked('product')">*</button>
                <button data-key="65" class="numberBtn" onclick="numberBtnClicked(0)">0</button>
                <button data-key="65" class="cBtn" onclick="clearAll()">C</button>
                <button data-key="65" class="functionBtn" onclick="calculate()">=</button>
                <button data-key="65" class="functionBtn" onclick="functionBtnClicked('divide')">/</button>
            </div>

    <script>
        let n1;
        let function1;
        let n2;
        let a = true;

        function numberBtnClicked(n) {
            document.getElementById("display").value = `${document.getElementById("display").value}${n}`;
            a = true;
        }

        function functionBtnClicked(functionName) {
            n1 = Number(document.getElementById("display").value);
            document.getElementById("display").value = "";
            function1 = functionName;

            a = undefined;
        }

        function calculate() {
            let result;
            if (a === true) {
                n2 = Number(document.getElementById("display").value);
            }

            if (a === undefined) {
                result = n1;
            } else {
                switch (function1) {
                    case "add": result = n1 + n2; break
                    case "subtract": result = n1 - n2; break
                    case "product": result = n1 * n2; break
                    case "divide": result = n1 / n2; break
                }
                console.log("switch worked")
                n1 = result;
                a = false;
            }

            document.getElementById("display").value = result;
        }

        function clearAll() {
            n1 = 0;
            n2 = 0;
            function1 = "";
            document.getElementById("display").value = 0;
        }

        document.addEventListener("keydown", function (e) {
            const key = e.key;

            switch (key) {
                case "+":
                    functionBtnClicked("add");
                    break;
                case "-":
                    functionBtnClicked("subtract");
                    break;
                case "*":
                    functionBtnClicked("product");
                    break;
                case "/":
                    functionBtnClicked("divide");
                    break;
                case "Enter":
                    calculate();
                    break;
                case "Escape":
                    clearAll();
                    break;
                default:
                    if (!isNaN(key)) {
                        numberBtnClicked(key);
                    }
            }
        });

            const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
            const key = document.querySelector(`div[data-key="${e.keyCode}"]`);
            if (!audio) return;
