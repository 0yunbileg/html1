<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tax Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }

    .question-box {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .question {
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #e9f7e9;
      border: 1px solid #c3e6c3;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="question-box">
    <div id="question" class="question">Do you currently work?</div>
    <div id="answers"></div>
    <div id="result"></div>
  </div>

  <script>
    const questions = {
      start: {
        text: "Do you currently work?",
        answers: [
          { text: "Yes", next: "income" },
          { text: "No", next: "student" }
        ]
      },
      income: {
        text: "What is your monthly income (in $)?",
        input: "number",
        next: "calcTax"
      },
      student: {
        text: "Are you a student?",
        answers: [
          { text: "Yes", next: "noTax" },
          { text: "No", next: "otherIncome" }
        ]
      },
      otherIncome: {
        text: "Do you have any other source of income?",
        answers: [
          { text: "Yes", next: "income" },
          { text: "No", next: "noTax" }
        ]
      },
      noTax: {
        text: "You don't need to pay tax based on your condition.",
        end: true
      },
      calcTax: {
        calculate: (income) => {
          let tax = 0;
          if (income <= 1000) tax = 0;
          else if (income <= 3000) tax = income * 0.1;
          else tax = income * 0.2;
          return `Your estimated tax is $${tax.toFixed(2)}.`;
        },
        end: true
      }
    };

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const resultEl = document.getElementById("result");

    function showQuestion(key) {
      const q = questions[key];
      answersEl.innerHTML = "";
      resultEl.innerHTML = "";

      if (q.text) questionEl.textContent = q.text;

      if (q.end && !q.calculate) {
        resultEl.textContent = q.text;
        return;
      }

      if (q.answers) {
        q.answers.forEach(a => {
          const btn = document.createElement("button");
          btn.textContent = a.text;
          btn.onclick = () => showQuestion(a.next);
          answersEl.appendChild(btn);
        });
      }

      if (q.input) {
        const input = document.createElement("input");
        input.type = q.input;
        input.id = "userInput";
        input.placeholder = "Enter amount";
        input.style.marginRight = "10px";

        const btn = document.createElement("button");
        btn.textContent = "Submit";
        btn.onclick = () => {
          const value = parseFloat(document.getElementById("userInput").value);
          if (!isNaN(value)) {
            const message = questions[q.next].calculate(value);
            resultEl.textContent = message;
          } else {
            resultEl.textContent = "Please enter a valid number.";
          }
        };

        answersEl.appendChild(input);
        answersEl.appendChild(btn);
      }
    }

    // Start
    showQuestion("start");
  </script>

</body>
</html>
