<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX</title>
    <link rel="stylesheet" href="spacex.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body>
    <header>
        <div class="logoWrapper">
            <i class="material-icons">rocket_launch</i>
        </div>

        <nav class="menu">
            <a>Home</a>
            <a>Launches</a>
            <a>About Us</a>
            <a>Contact Us</a>
        </nav>
    </header>

    <div class="heroWrapper">
        <div class="heroImgWrapper">
            <img class="heroImg"
                src="https://cdn.sanity.io/images/hvd5n54p/blog/f483d075472b315d8617ea691de91f1b71e9b157-2560x1182.jpg?w=2048&q=75&fit=clip&auto=format" />
        </div>

        <div class="heroTextWrapper">
            <h2 class="heroTitle">EXPLORE SPACEX MISSIONS.</h2>
            <p class="heroText">Discover SpaceX missions, upcoming launches, and the future of space travel.</p>
        </div>
    </div>

    <div class="upcomingMissionsWrapper">
        <h3>Upcoming Launches: </h3>
        <table>
            <thead>
                <tr>
                    <th>Mission name</th>
                    <th>Date UTC</th>
                    <th>Flight Number</th>
                    <th>See More</th>
                </tr>
            </thead>

            <tbody class="upcomingMissionsDiv">

            </tbody>
        </table>
    </div>

    <div class="pastMissionsWrapper">
        <h3>Past Missions: </h3>

        <table>
            <thead>
                <tr>
                    <td>Mission name</td>
                    <td>Date UTC</td>
                    <td>Flight Number</td>
                    <td>See More</td>
                </tr>
            </thead>

            <tbody class="pastMissionsDiv">

            </tbody>
        </table>
    </div>

    <script src="spacex.js"></script>

</body>

</html>
