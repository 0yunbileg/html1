<!DOCTYPE html>

      font-family: Arial, sans-serif;

      padding: 20px;
    }
    .box {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);

      border-radius: 8px;
      background: #007bff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;

    button:hover {

    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #e9f7e9;
      border: 1px solid #c3e6c3;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;

  </style>
</head>

    function showQuestion(key) {
      const q = questions[key];
      answersEl.innerHTML = "";
      resultEl.innerHTML = "";

      if (q.finalId) {
        questionEl.textContent = "Таны ангилал тодорхой боллоо:";
        resultEl.textContent = "Ангилал ID: " + q.finalId;
        return;
      }

      questionEl.textContent = q.text;
      q.answers.forEach(a => {
        const btn = document.createElement("button");
        btn.textContent = a.text;
        btn.onclick = () => showQuestion(a.next);
        answersEl.appendChild(btn);
      });
    }

</html>
