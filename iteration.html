<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iteration</title>
</head>

<body>
    <script>
        //Ex1.1
        // for(let i = 0; i < 101; i++) {
        //     console.log("ex1: ", i);
        // };

        //Ex1.2
        let fruits = ["apple", "banana", "mango", "orange", "strawberry"];
        for (let i = 0; i < fruits.length; i++) {
            console.log("ex2: ", fruits[i]);
        };

        //Ex1.3
        const cars = ["BMW", "Volvo", "Saab", "Ford", "Fiat", "Audi"];
        for (let i = 0; i <= fruits.length; i += 2) {
            console.log("ex3: ", cars[i]);
        };

        //Ex1.4
        let sum = 0;
        for (let i = 1; i < 11; i++) { sum += i; };
        console.log("ex4: ", sum);

        // //Ex2.1
        // let i = 1;
        // while(i < 100) {
        //     console.log("ex1: ", i);
        //     i += 2;
        // };

        // //Ex2.2
        // i = 2;
        // while(i < 100) {
        //     console.log("ex2: ", i);
        //     i += 2;
        // };

        //Ex2.3
        sum = 0;
        i = 0;
        while (sum <= 100) {
            sum += i;
            console.log(`ex3: added ${i}, sum ${sum}`);
            i++;
        }

        //Ex2.4
        i = 1;
        while (i < 50) {
            if (i % 3 == 0) { console.log("ex4: ", i) };
            i++;
        }

        //Ex2.5
        let numbers = [1, 3, 5, 7, 8, 9, 11];
        i = 0;
        while (i < numbers.length) {
            if (numbers[i] % 2 == 0) {
                console.log("ex5: ", numbers[i]);
                break;
            }
            i++;
        };

        //Ex3.1
        const users = [
            { id: 1, name: "Tsetsegee" },
            { id: 2, name: "Dulmaa" },
            { id: 3, name: "Bataa" },
        ];


        const orders = [
            {
                userId: 1, items: [
                    { name: "MacBook", price: 2500000 },
                    { name: "Mouse", price: 40000 }]
            },

            { userId: 2, items: [{ name: "Pen", price: 2000 }] },

            { userId: 3, items: [{ name: "Chair", price: 120000 }] },

        ];

        const moreThan100kOrders = orders.filter(order => order.items.some(item => item.price > 100000));

        const moreThan100kUsers = new Array();
        moreThan100kOrders.map(order => {
            moreThan100kUsers.push(users.find(user => user.id === order.userId).name);
        });

        console.log("ex1: ", moreThan100kUsers);

        //Ex3.2
        const students = [
            { id: 1, name: "William", selectedSubjects: ["Math", "Physics"] },
            { id: 2, name: "Drake", selectedSubjects: ["Biology", "Chemistry"] },
            { id: 3, name: "Weekend", selectedSubjects: ["Math", "History"] },
        ];

        const subjects = [
            { name: "Math" },
            { name: "Physics" },
            { name: "Chemistry" },
            { name: "Biology" },
            { name: "History" },
        ];

        let subject = subjects.find(subject => subject.name === "Math");

        const mathStudentsNames = students
            .filter(student => student.selectedSubjects.includes(subject.name))
            .map(mathStudent => mathStudent.name);

        console.log("ex2: ", mathStudentsNames);

        //Ex3.3
        const user = { id: 1, name: "Anu" };

        const orders1 = [
            { userId: 1, items: ["Book", "Pen"] },
            { userId: 2, items: ["Chair"] },
            { userId: 1, items: ["Notebook", "Bag"] },
        ];

        const usersOrders = orders1.filter(order => order.userId === user.id);
        const userItems = usersOrders.map(order => order.items.flat().join(", "));

        console.log(`ex3: ${user.name} has ordered: `, userItems.toString());

        //Ex4
        const users2 = [
            { id: 1, name: 'Zorigoo', vip: true },
            { id: 2, name: 'Ariuka', vip: false },
            { id: 3, name: 'Ugudei', vip: true },
            { id: 4, name: 'Tuguldur', vip: false },
        ];

        const orders2 = [
            { userId: 1, items: ['Phone', 'Laptop'], total: 120000 },
            { userId: 2, items: ['Book'], total: 20000 },
            { userId: 3, items: ['Fridge', 'TV'], total: 300000 },
            { userId: 4, items: ['Mouse'], total: 15000 },
            { userId: 1, items: ['Tablet'], total: 80000 },
            { userId: 3, items: ['Camera'], total: 100000 },
        ];

        //4.1
        const vipUsers = users2.filter(user => user.vip === true);
        console.log("ex4, vip users: ", vipUsers);

        //4.2
        const highAvgUsers = users2.filter(user => {
            const usersOrders = orders2.filter(order => order.userId === user.id);
            const totalAmount = usersOrders.reduce((sum, order) => sum + order.total, 0);
            const avgAmount = usersOrders.length > 0 ? totalAmount / usersOrders.length : 0;
            return avgAmount > 100000;
        });
        console.log("ex4, avg more than 100000:", highAvgUsers);

        //4.3
        const cameraUsers = users2.filter(user => {
            const usersOrders = orders2.filter(order => order.userId === user.id);
            return usersOrders.some(order => order.items.includes('Camera'))
        });
        console.log("ex4, camera users: ", cameraUsers);
    </script>
</body>

</html>
